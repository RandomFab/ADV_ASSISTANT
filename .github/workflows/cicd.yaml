name: CI — Lint · Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────
  # 1. LINT
  # ──────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install backend dev deps
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend dev deps
        working-directory: frontend
        run: uv sync --frozen

      - name: Ruff — lint backend
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff — lint frontend
        working-directory: frontend
        run: uv run ruff check .

      - name: Ruff — format check (backend)
        working-directory: backend
        run: uv run ruff format --check .

      - name: Ruff — format check (frontend)
        working-directory: frontend
        run: uv run ruff format --check .

  # ──────────────────────────────────────────
  # 2. BUILD IMAGES (validation only, no push)
  # ──────────────────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: lint

    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - service: mcp-server
            context: backend
            target: mcp
          - service: fastapi
            context: backend
            target: fastapi
          - service: streamlit
            context: frontend
            target: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
