# docker-compose.yml — à la racine du projet

services:
  postgres:
    image: postgres:16                    # Version LTS stable, on évite "latest" en prod
    container_name: steelbot_postgres
    restart: unless-stopped               # Redémarre automatiquement sauf si on l'arrête manuellement
    
    env_file:
      - .env                               # On charge les variables d'environnement depuis le fichier .env
    
    ports:
      - "5432:5432"                       # host:container — permet de se connecter depuis ta machine
    
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Volume nommé = données persistantes
    
    healthcheck:                          # Docker sait quand Postgres est vraiment prêt (pas juste démarré)
      test: ["CMD-SHELL", "pg_isready -U steelbot_user -d steelbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:                          # Déclaration du volume nommé géré par Docker