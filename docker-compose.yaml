# docker-compose.yml — à la racine du projet

services:
  postgres:
    image: postgres:16
    container_name: steelbot_postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - steelbot_network

  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: mcp
    container_name: steelbot_mcp
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      # /sse est un flux SSE qui ne se termine jamais — on accepte exit 28 (timeout) = serveur répond
      test: ["CMD-SHELL", "curl -s --max-time 2 http://localhost:8000/sse; status=$$?; [ $$status -eq 0 ] || [ $$status -eq 28 ]"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - steelbot_network

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: fastapi
    container_name: steelbot_api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "127.0.0.1:8001:8001"

    depends_on:
      postgres:
        condition: service_healthy
      mcp-server:
        condition: service_healthy

    environment:
      - MCP_URL=http://mcp-server:8000

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - steelbot_network

  streamlit:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: steelbot_ui
    restart: unless-stopped

    ports:
      - "127.0.0.1:8501:8501"

    depends_on:
      fastapi:
        condition: service_healthy

    environment:
      - API_URL=http://fastapi:8001
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0

    networks:
      - steelbot_network

volumes:
  postgres_data:

networks:
  steelbot_network:
    driver: bridge