[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    unit: unit tests
    functional: functional tests
    integration: integration tests
